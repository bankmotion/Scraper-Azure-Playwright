name: Trigger auto deployment for mycontainerapp117

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/mycontainerapp117-AutoDeployTrigger-d2b38d04-0e81-4611-a359-679c1cfcd066.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.MYCONTAINERAPP117_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MYCONTAINERAPP117_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MYCONTAINERAPP117_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: myregistry117.azurecr.io
          registryUsername: ${{ secrets.MYCONTAINERAPP117_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MYCONTAINERAPP117_REGISTRY_PASSWORD }}
          containerAppName: mycontainerapp117
          resourceGroup: my-resource-group
          imageToBuild: myregistry117.azurecr.io/mycontainerapp117:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


